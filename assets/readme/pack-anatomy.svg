<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img"
     aria-labelledby="pk-title pk-desc"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="pk-title">xpskill 技能包里装了什么：扮演层 SKILL.md、检索层 references/ 与打包体 zip</title>
  <desc id="pk-desc">白色卡片分三栏：左栏是扮演用的 SKILL.md，中栏是检索用的 references 目录，右栏是可直接上传的 zip；底部说明整包默认脱敏。</desc>

  <rect width="1200" height="480" rx="26" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="26" fill="none" stroke="#16203F" stroke-opacity="0.08"/>

  <g id="heading">
    <text x="64" y="70" font-size="18" fill="#1246FF" font-family="ui-monospace,Consolas,monospace">产物</text>
    <text x="64" y="118" font-size="42" font-weight="700" fill="#16203F">技能包里装了什么</text>
    <text x="64" y="154" font-size="20" fill="#4A5268">扮演用的人设只有十几 KB；「哪天说的、原话是什么」靠检索 references/。</text>
  </g>

  <g id="layers">
    <g>
      <rect x="64" y="186" width="346" height="232" rx="18" fill="#F7FBFF" stroke="#16203F" stroke-opacity="0.07"/>
      <text x="88" y="238" font-size="22" fill="#0A35CC" font-family="ui-monospace,Consolas,monospace">SKILL.md</text>
      <text x="88" y="272" font-size="18" fill="#4A5268">十几 KB · 蒸馏后的结论</text>
      <text x="88" y="312" font-size="20" fill="#16203F">身份与说话风格</text>
      <text x="88" y="342" font-size="20" fill="#16203F">口头禅与接话方式</text>
      <text x="88" y="372" font-size="20" fill="#16203F">情感模式、温度与分寸</text>
      <text x="88" y="402" font-size="20" fill="#16203F">关系行为与典型例句</text>
    </g>
    <g>
      <rect x="431" y="186" width="346" height="232" rx="18" fill="#F7FBFF" stroke="#16203F" stroke-opacity="0.07"/>
      <text x="455" y="238" font-size="22" fill="#0A35CC" font-family="ui-monospace,Consolas,monospace">references/</text>
      <text x="455" y="272" font-size="18" fill="#4A5268">原记录 · 档案 · 依据</text>
      <text x="455" y="312" font-size="20" fill="#16203F">memory.md 关系记忆</text>
      <text x="455" y="342" font-size="20" fill="#16203F">transcript/ 逐月原记录</text>
      <text x="455" y="372" font-size="20" fill="#16203F">topics.md 主题档案</text>
      <text x="455" y="402" font-size="20" fill="#16203F">evidence.md 结论 ← 原话</text>
    </g>
    <g>
      <rect x="798" y="186" width="346" height="232" rx="18" fill="#EEF2FF" stroke="#1246FF" stroke-opacity="0.35"/>
      <text x="822" y="238" font-size="22" fill="#0A35CC" font-family="ui-monospace,Consolas,monospace">&lt;name&gt;.zip</text>
      <text x="822" y="272" font-size="18" fill="#4A5268">通常 1~3 MB</text>
      <text x="822" y="312" font-size="20" fill="#16203F">上传到设备控制台</text>
      <text x="822" y="342" font-size="20" fill="#16203F">在技能列表设为主技能</text>
      <text x="822" y="372" font-size="20" fill="#16203F">之后唤醒即生效</text>
      <text x="822" y="402" font-size="20" fill="#16203F">也可以 --device 直传</text>
    </g>
  </g>

  <g id="redaction-note">
    <line x1="64" y1="436" x2="1136" y2="436" stroke="#16203F" stroke-opacity="0.08"/>
    <text x="64" y="464" font-size="18" fill="#4A5268">整包默认脱敏（手机号 / 身份证 / 卡号 / 邮箱 / 详细地址）；--no-redact 保留原样，那份别外发。</text>
  </g>
</svg>
