<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>试聊 · kith-skill</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/play.css">
<link rel="icon" type="image/png" href="/static/logo.png?v=qlab">
</head>
<body class="play">

<header class="topbar">
  <div class="brand">
    <img class="brand__mark" src="/static/logo.png?v=qlab" alt="kith-skill logo" width="30" height="30">
    <span class="brand__name">试聊</span>
    <span class="brand__sub">本地页面 · 聊天只发给你配置的那个接口</span>
  </div>
  <div class="status">
    <a class="play__back" href="/">← 返回工作台</a>
  </div>
</header>

<main class="play__wrap">
  <section class="card play__card">
    <!-- 人设与状态就摆在这一行：嵌进标签时它就是这张页面唯一的表头 -->
    <div class="play__meta">
      <span class="play__who" id="who">读取中…</span>
      <!-- 换人设：out/ 下之前生成过的 skill 都在这里（工作台重启过也还在） -->
      <label class="play__swap" title="换一个人设：之前生成过的 skill 都能挑">
        <select id="skill" aria-label="选择人设"></select>
      </label>
      <span class="play__files" id="ctx">—</span>
      <span class="state" id="chip-state"><i class="dot"></i><b id="state-text">准备中</b></span>
    </div>

    <div class="play__scroll" id="scroll">
      <div class="placeholder" id="hello">
        <div class="placeholder__box">[ 本地试聊 ]</div>
        <p class="placeholder__title">随便说点什么，TA 会按这次蒸馏出的人设回你</p>
        <p class="placeholder__hint">
          人设与记忆取的是 <code>out/&lt;技能名&gt;/</code> 里的那几份文件 —— 表头那个下拉<br>
          可以换成之前生成过的任何一份；手改过文件的话，刷新本页即生效。
        </p>
      </div>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <input type="text" id="say" placeholder="跟 TA 说点什么…（Enter 发送）" disabled>
      <button class="btn btn--go btn--send" id="send" type="submit" disabled>发送</button>
      <button class="btn btn--ghost btn--send" id="reset" type="button">重开</button>
    </form>
  </section>

  <section class="card play__cfg">
    <details id="cfg">
      <summary class="card__head"><span class="num">02</span>接口<span class="en">config</span></summary>
      <div class="card__body">
        <label class="field">
          <span class="field__k">接口地址</span>
          <input type="text" id="f-baseurl" spellcheck="false">
        </label>
        <label class="field">
          <span class="field__k">模型</span>
          <input type="text" id="f-model" spellcheck="false">
        </label>
        <label class="field">
          <span class="field__k">API Key<em id="key-hint">只留在本机内存</em></span>
          <input type="password" id="f-apikey" spellcheck="false">
        </label>
        <label class="field">
          <span class="field__k">聊天温度<em>越高越松，太高会开始说飘话</em></span>
          <select id="f-temp">
            <option value="0.7">0.7 · 稳（像在回消息但克制）</option>
            <option value="1.1">1.1 · 默认</option>
            <option value="1.3">1.3 · 活跃</option>
            <option value="1.6">1.6 · 很飘</option>
          </select>
        </label>
        <p class="play__hint">
          生成人设的那次运行若带了 Key，这里留空就直接用它（不落盘、不写日志）；
          离线蒸馏出来的产物没有 Key，得自己填一个才能试聊。
        </p>
        <label class="check"><input type="checkbox" id="f-semantic"><span>用模型判断情境</span><em>额外发送最近六轮到当前接口</em></label>
      </div>
    </details>
  </section>
</main>

<script src="/static/play.js"></script>
</body>
</html>
